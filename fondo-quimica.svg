<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fondo con frascos de química" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>

    <!-- Matraz Erlenmeyer -->
    <symbol id="erlenmeyer" viewBox="0 0 100 140" overflow="visible">
      <clipPath id="cl-erl"><path d="M40 8 L40 45 L10 125 Q8 135 20 135 L80 135 Q92 135 90 125 L60 45 L60 8 Z"/></clipPath>
      <rect x="0" y="88" width="100" height="50" fill="currentColor" opacity=".85" clip-path="url(#cl-erl)"/>
      <path d="M40 8 L40 45 L10 125 Q8 135 20 135 L80 135 Q92 135 90 125 L60 45 L60 8 Z" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
      <rect x="36" y="2" width="28" height="8" rx="3" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
      <path d="M26 100 L33 82" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <!-- Matraz de fondo redondo -->
    <symbol id="redondo" viewBox="0 0 100 140" overflow="visible">
      <clipPath id="cl-red"><circle cx="50" cy="92" r="44"/></clipPath>
      <rect x="0" y="92" width="100" height="60" fill="currentColor" opacity=".85" clip-path="url(#cl-red)"/>
      <path d="M42 8 L42 52 A44 44 0 1 0 58 52 L58 8" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
      <rect x="38" y="2" width="24" height="8" rx="3" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
      <path d="M22 100 A30 30 0 0 0 36 122" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <!-- Vaso de precipitados -->
    <symbol id="vaso" viewBox="0 0 100 140" overflow="visible">
      <clipPath id="cl-vaso"><path d="M15 12 L15 122 Q15 132 25 132 L75 132 Q85 132 85 122 L85 12 Z"/></clipPath>
      <rect x="0" y="62" width="100" height="80" fill="currentColor" opacity=".85" clip-path="url(#cl-vaso)"/>
      <path d="M15 12 L15 122 Q15 132 25 132 L75 132 Q85 132 85 122 L85 12" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
      <path d="M10 12 L24 12 M76 12 L90 12" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
      <g stroke="#fff" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round">
        <path d="M15 45 L30 45"/><path d="M15 70 L26 70"/><path d="M15 95 L30 95"/>
      </g>
    </symbol>

    <!-- Tubo de ensayo -->
    <symbol id="tubo" viewBox="0 0 100 140" overflow="visible">
      <clipPath id="cl-tubo"><path d="M36 8 L36 100 A14 14 0 0 0 64 100 L64 8 Z"/></clipPath>
      <rect x="0" y="70" width="100" height="80" fill="currentColor" opacity=".85" clip-path="url(#cl-tubo)"/>
      <path d="M36 8 L36 100 A14 14 0 0 0 64 100 L64 8" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
      <path d="M32 8 L68 8" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
      <path d="M43 78 L43 98" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1200" height="800" fill="url(#fondo)"/>

  <!-- Frascos -->
  <use href="#erlenmeyer" x="90"   y="90"  width="150" height="210" color="#22d3ee" transform="rotate(-8 165 195)"/>
  <use href="#redondo"    x="470"  y="40"  width="130" height="182" color="#a78bfa" transform="rotate(6 535 131)"/>
  <use href="#vaso"       x="880"  y="70"  width="140" height="196" color="#34d399" transform="rotate(-5 950 168)"/>
  <use href="#tubo"       x="1060" y="300" width="100" height="140" color="#f472b6" transform="rotate(12 1110 370)"/>
  <use href="#tubo"       x="30"   y="430" width="90"  height="126" color="#fbbf24" transform="rotate(-14 75 493)"/>
  <use href="#vaso"       x="260"  y="470" width="170" height="238" color="#60a5fa" transform="rotate(4 345 589)"/>
  <use href="#erlenmeyer" x="620"  y="420" width="190" height="266" color="#fb7185" transform="rotate(-6 715 553)"/>
  <use href="#redondo"    x="930"  y="520" width="150" height="210" color="#2dd4bf" transform="rotate(9 1005 625)"/>
  <use href="#tubo"       x="360"  y="260" width="70"  height="98"  color="#c084fc" transform="rotate(-10 395 309)"/>
  <use href="#erlenmeyer" x="740"  y="230" width="90"  height="126" color="#facc15" transform="rotate(10 785 293)"/>

  <!-- Burbujas -->
  <g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2">
    <circle cx="300" cy="120" r="10"/><circle cx="325" cy="85" r="6"/><circle cx="285" cy="60" r="4"/>
    <circle cx="660" cy="150" r="9"/><circle cx="690" cy="110" r="5"/>
    <circle cx="1040" cy="150" r="8"/><circle cx="1075" cy="105" r="5"/><circle cx="1100" cy="60" r="10"/>
    <circle cx="190" cy="360" r="7"/><circle cx="215" cy="330" r="4"/>
    <circle cx="520" cy="380" r="11"/><circle cx="545" cy="335" r="6"/>
    <circle cx="880" cy="400" r="8"/><circle cx="905" cy="365" r="5"/>
    <circle cx="560" cy="740" r="9"/><circle cx="830" cy="760" r="6"/><circle cx="140" cy="720" r="8"/>
  </g>

  <!-- Destellos -->
  <g stroke="#fff" stroke-opacity=".3" stroke-width="2.5" stroke-linecap="round">
    <path d="M430 190 v16 M422 198 h16"/><path d="M820 350 v16 M812 358 h16"/>
    <path d="M60 300 v16 M52 308 h16"/><path d="M1150 650 v16 M1142 658 h16"/>
    <path d="M470 560 v16 M462 568 h16"/><path d="M200 760 v16 M192 768 h16"/>
  </g>
</svg>
